[tool:pytest]
testpaths = tests_new
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    -v
    --cov=custom_components.eltako
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=70
markers =
    asyncio: marks tests as async
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow running
    requires_hardware: marks tests that require actual hardware
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
asyncio_mode = auto
minversion = 6.0